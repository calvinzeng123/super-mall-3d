[build]
  command = "npm run build:netlify"
  publish = "dist/netlify"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
