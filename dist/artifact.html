<title>云澜汇园区 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* 版式概念：全屏 3D 舞台 + 商场导视牌式的浮动面板（左侧楼层牌、右侧店铺目录、右上工具条） */
:root {
  --stage: #dfe6ea;
  --panel: rgba(250, 250, 247, 0.92);
  --panel-solid: #fafaf7;
  --ink: #1c2226;
  --ink-2: #56616a;
  --ink-3: #87919a;
  --line: rgba(28, 34, 38, 0.12);
  --chip: rgba(28, 34, 38, 0.06);
  --accent: #0f6f86;
  --accent-ink: #ffffff;
  --danger: #b4232c;
  --shadow: 0 12px 32px rgba(18, 28, 38, 0.16);
  --radius: 10px;
  --font-sign: "Barlow Semi Condensed", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --font-ui: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage: #0e1215; --panel: rgba(20, 24, 28, 0.9); --panel-solid: #14181c;
    --ink: #eceeef; --ink-2: #a5aeb6; --ink-3: #737d86; --line: rgba(236, 238, 239, 0.14);
    --chip: rgba(236, 238, 239, 0.08); --accent: #43b6cd; --accent-ink: #062027; --danger: #f07178;
    --shadow: 0 12px 32px rgba(0, 0, 0, 0.45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage: #0e1215; --panel: rgba(20, 24, 28, 0.9); --panel-solid: #14181c;
  --ink: #eceeef; --ink-2: #a5aeb6; --ink-3: #737d86; --line: rgba(236, 238, 239, 0.14);
  --chip: rgba(236, 238, 239, 0.08); --accent: #43b6cd; --accent-ink: #062027; --danger: #f07178;
  --shadow: 0 12px 32px rgba(0, 0, 0, 0.45); color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--stage); color: var(--ink); font: 14px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
#app { position: fixed; inset: 0; overflow: hidden; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
button { font: inherit; color: inherit; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

/* 品牌 */
.brand { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; padding: 12px 16px 12px 14px; display: grid; gap: 2px; min-width: 0; max-width: calc(100% - 32px); }
.brand-row { display: flex; align-items: baseline; gap: 10px; }
.brand-mark { font: 700 22px/1.1 var(--font-ui); letter-spacing: 0.08em; }
.brand-en { font: 600 13px/1 var(--font-sign); letter-spacing: 0.18em; color: var(--accent); }
.brand-floor { font-size: 12px; color: var(--ink-2); }

/* 分期切换 + 楼层牌 */
.floors { position: absolute; left: 16px; top: 50%; transform: translateY(-46%); padding: 6px; display: flex; flex-direction: column; gap: 6px; max-height: calc(100% - 200px); }
.phases { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px; }
.phase { all: unset; box-sizing: border-box; display: grid; gap: 1px; padding: 6px 8px; border-radius: 7px; cursor: pointer; background: var(--chip); }
.phase b { font: 600 14px/1.1 var(--font-ui); }
.phase span { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.phase:hover { background: var(--line); }
.phase:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.phase[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.phase[aria-pressed="true"] span { color: var(--accent-ink); opacity: 0.8; }
.phase:disabled { cursor: default; opacity: 0.45; }
.floor-list { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; min-height: 0; }
.floor { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 46px 1fr; align-items: center; gap: 10px; width: 156px; padding: 4px 10px 4px 4px; border-radius: 7px; cursor: pointer; color: var(--ink); }
.floor:hover { background: var(--chip); }
.floor:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.fl-num { display: grid; place-items: center; height: 34px; border-radius: 6px; font: 600 19px/1 var(--font-sign); letter-spacing: 0.02em; background: var(--chip); border-left: 4px solid var(--fc, var(--accent)); }
.fl-name { font-size: 12px; line-height: 1.25; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.floor[aria-pressed="true"] .fl-num { background: var(--fc, var(--accent)); color: #fff; border-left-color: transparent; }
.floor[aria-pressed="true"] .fl-name { color: var(--ink); font-weight: 600; }
.floor.all .fl-num { font-size: 14px; }

/* 工具条 */
.toolbar { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; padding: 5px; max-width: calc(100% - 32px); }
.tool { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 11px; border-radius: 7px; cursor: pointer; font-size: 13px; color: var(--ink); white-space: nowrap; }
.tool svg { width: 17px; height: 17px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tool:hover { background: var(--chip); }
.tool:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tool[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tool.dir-btn { display: none; }

/* 店铺目录 */
.directory { position: absolute; right: 16px; top: calc(72px + env(safe-area-inset-top, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 312px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.dir-head { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
.dir-badge { display: grid; place-items: center; min-width: 52px; height: 52px; padding: 0 6px; border-radius: 8px; background: var(--fc, var(--accent)); color: #fff; font: 700 24px/1 var(--font-sign); }
.dir-title { font-weight: 700; font-size: 15px; }
.dir-theme { font-size: 12px; color: var(--ink-2); }
.dir-search { padding: 10px 14px 6px; }
.dir-search input { width: 100%; box-sizing: border-box; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-solid); color: var(--ink); font: inherit; }
.dir-search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
.dir-facts { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 14px 10px; }
.fact { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; background: var(--chip); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.fact b { color: var(--ink); font-weight: 600; }
.dir-list { list-style: none; margin: 0; padding: 4px 6px 10px; overflow-y: auto; flex: 1; min-height: 0; }
.dir-group { padding: 10px 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--ink-3); }
.shop { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 50px 1fr auto; gap: 8px; align-items: center; width: 100%; padding: 7px 8px; border-radius: 7px; cursor: pointer; }
.shop:hover, .shop.active { background: var(--chip); }
.shop:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.shop-code { font: 600 13px/1 var(--font-sign); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.shop-name { min-width: 0; }
.shop-name b { display: block; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shop-name span { display: block; font: 500 11.5px/1.3 var(--font-sign); letter-spacing: 0.04em; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shop-cat { font-size: 11px; padding: 2px 7px; border-radius: 999px; color: #fff; background: var(--cc, var(--ink-3)); white-space: nowrap; }
.empty { padding: 20px 10px; color: var(--ink-3); font-size: 13px; }

/* 图例、提示、浮窗 */
.legend { position: absolute; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding: 10px 12px; display: grid; gap: 6px; font-size: 12px; }
.legend-row { display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
.legend-swatch { width: 26px; height: 6px; border-radius: 3px; }
.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding: 6px 12px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.tooltip { position: absolute; z-index: 5; pointer-events: none; padding: 8px 10px; max-width: 240px; font-size: 12px; transform: translate(14px, 14px); }
.tooltip b { display: block; font-size: 14px; }
.tooltip .en { font: 600 12px/1.3 var(--font-sign); letter-spacing: 0.05em; color: var(--ink-3); }
.tooltip .meta { margin-top: 3px; color: var(--ink-2); }
.tour-bar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(56px + env(safe-area-inset-bottom, 0px)); padding: 10px 14px; display: flex; align-items: center; gap: 12px; font-size: 13px; }
.tour-bar .step { font-weight: 600; }
.tour-bar button { all: unset; cursor: pointer; padding: 5px 10px; border-radius: 6px; background: var(--chip); font-size: 12px; }
.tour-bar button:focus-visible { outline: 2px solid var(--accent); }

/* 加载与错误 */
.loading { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: var(--stage); color: var(--ink-2); z-index: 10; transition: opacity 0.5s; }
.loading.done { opacity: 0; pointer-events: none; }
.loading .mark { font: 700 34px/1 var(--font-ui); letter-spacing: 0.12em; color: var(--ink); }
.loading .en { font: 600 14px/1 var(--font-sign); letter-spacing: 0.3em; color: var(--accent); }
.bar { width: 220px; height: 4px; border-radius: 2px; background: var(--chip); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s; }
.fatal { position: absolute; inset: 0; z-index: 20; display: grid; place-content: center; padding: 24px; background: var(--stage); }
.fatal .box { max-width: 420px; padding: 20px 22px; }
.fatal h2 { margin: 0 0 8px; font-size: 18px; }
.fatal p { margin: 0; color: var(--ink-2); }

@media (max-width: 760px) {
  .brand { padding: 9px 12px; }
  .brand-mark { font-size: 18px; }
  .brand-floor { display: none; }
  .toolbar { top: auto; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); right: 12px; left: 12px; max-width: none; justify-content: center; }
  .tool span { display: none; }
  .tool { padding: 0 9px; }
  .tool.dir-btn { display: inline-flex; }
  .floors { top: auto; transform: none; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 12px; right: 12px; flex-direction: row; overflow-x: auto; max-height: none; }
  .phases { display: flex; flex: none; }
  .phase { padding: 6px 8px; }
  .phase span { display: none; }
  .floor-list { flex-direction: row; overflow: visible; }
  .floor { width: auto; grid-template-columns: 44px; padding: 3px; }
  .fl-name { display: none; }
  .directory { left: 12px; right: 12px; width: auto; top: 30%; bottom: calc(124px + env(safe-area-inset-bottom, 0px)); }
  .directory.collapsed { display: none; }
  .hint, .legend { display: none; }
  .tour-bar { bottom: calc(130px + env(safe-area-inset-bottom, 0px)); width: calc(100% - 48px); box-sizing: border-box; justify-content: space-between; }
}
@media (prefers-reduced-motion: reduce) {
  .loading, .bar i { transition: none; }
}

</div>
