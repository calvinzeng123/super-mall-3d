<title>云澜汇停车地图</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Map app: a full-bleed indoor-style map with floating cards — search and panel on the left,
   floor picker and tools on the right, scale at the bottom. Day palette by default, night in dark mode. */
:root {
  --land: #f2f0eb; --plot: #eae7df; --green: #d3e8c0; --water: #a9d3f2;
  --road: #ffffff; --road-edge: #d6d0c2; --road-major: #fde49b; --road-major-edge: #ecc25f;
  --bldg: #e5e0d4; --bldg-edge: #cdc5b3;
  --deck: #e2e8f1; --deck-edge: #a7b4c7; --deck-other: #e8e6e1; --deck-other-edge: #c2bdb2;
  --aisle: #fbfcfe; --stall: #cad3df; --stall-edge: #9aa8bc; --stall-ev: #9edbb4; --stall-acc: #9bc3fa; --col: #7a8698; --core: #5a7ed8;
  --concourse: #f4e4c6; --concourse-edge: #d6b479; --lot: #e7eaef;
  --street: #ff7a1a; --inner: #7a5bff; --link: #1f6fff; --walk: #12a26b; --risk: #e5484d; --warn: #e89a10; --ok: #1f9d68;
  --ink: #222a34; --muted: #677181; --halo: #ffffff; --card: #ffffff; --card-edge: #e1e4ea; --soft: #f4f6f9;
  --shadow: 0 2px 10px rgba(30, 40, 60, .16);
  --accent: #2f6bff; --accent-ink: #ffffff; --chip: #ecf1fd;
  --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --num: "Barlow Semi Condensed", "DIN Alternate", "Helvetica Neue", Arial, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --land: #151b26; --plot: #1a212e; --green: #1b2a24; --water: #1c344f;
  --road: #2a3345; --road-edge: #20283a; --road-major: #4a432f; --road-major-edge: #5c5135;
  --bldg: #222a39; --bldg-edge: #303a4d;
  --deck: #1e2737; --deck-edge: #3d4b63; --deck-other: #20242d; --deck-other-edge: #353b48;
  --aisle: #2b3548; --stall: #333f58; --stall-edge: #4b5a76; --stall-ev: #2e6a51; --stall-acc: #2e5490; --col: #8591a6; --core: #7d9cf2;
  --concourse: #3a3223; --concourse-edge: #6c5934; --lot: #1f2633;
  --street: #ff8a3d; --inner: #9a85ff; --link: #5c96ff; --walk: #31c48a; --risk: #ff6b70; --warn: #f2b340; --ok: #3cc788;
  --ink: #e4e9f1; --muted: #98a3b5; --halo: #151b26; --card: #1d2431; --card-edge: #2d3646; --soft: #232b39;
  --shadow: 0 2px 14px rgba(0, 0, 0, .45);
  --accent: #5d8dff; --accent-ink: #0c1120; --chip: #253049; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --land: #151b26; --plot: #1a212e; --green: #1b2a24; --water: #1c344f;
  --road: #2a3345; --road-edge: #20283a; --road-major: #4a432f; --road-major-edge: #5c5135;
  --bldg: #222a39; --bldg-edge: #303a4d;
  --deck: #1e2737; --deck-edge: #3d4b63; --deck-other: #20242d; --deck-other-edge: #353b48;
  --aisle: #2b3548; --stall: #333f58; --stall-edge: #4b5a76; --stall-ev: #2e6a51; --stall-acc: #2e5490; --col: #8591a6; --core: #7d9cf2;
  --concourse: #3a3223; --concourse-edge: #6c5934; --lot: #1f2633;
  --street: #ff8a3d; --inner: #9a85ff; --link: #5c96ff; --walk: #31c48a; --risk: #ff6b70; --warn: #f2b340; --ok: #3cc788;
  --ink: #e4e9f1; --muted: #98a3b5; --halo: #151b26; --card: #1d2431; --card-edge: #2d3646; --soft: #232b39;
  --shadow: 0 2px 14px rgba(0, 0, 0, .45);
  --accent: #5d8dff; --accent-ink: #0c1120; --chip: #253049; color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; }
body { height: 100%; margin: 0; background: var(--land); color: var(--ink); font-family: var(--font); font-size: 14px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
#app { position: relative; height: 100%; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; background: var(--land); }
#map.dragging { cursor: grabbing; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

/* ---------- SVG map styling (all colours from tokens) ---------- */
.land { fill: var(--land); }
.plot { fill: var(--plot); }
.plot.park { fill: var(--green); }
.road { fill: var(--road); stroke: var(--road-edge); stroke-width: 1; vector-effect: non-scaling-stroke; }
.road.major { fill: var(--road-major); stroke: var(--road-major-edge); }
.xing { fill: url(#zebra); }
.bldg { fill: var(--bldg); stroke: var(--bldg-edge); stroke-width: 1; vector-effect: non-scaling-stroke; }
.ghost { fill: none; stroke: var(--bldg-edge); stroke-width: 1; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; opacity: .8; }
.dim .road, .dim .road.major { fill: var(--plot); stroke: var(--road-edge); }
.deck { fill: var(--deck); stroke: var(--deck-edge); stroke-width: 1.2; vector-effect: non-scaling-stroke; fill-rule: evenodd; }
.deck.other { fill: var(--deck-other); stroke: var(--deck-other-edge); }
.deck.concourse { fill: var(--concourse); stroke: var(--concourse-edge); }
.aisle { fill: var(--aisle); }
.lobby { fill: var(--soft); }
.stall { fill: var(--stall); stroke: var(--stall-edge); stroke-width: .6; vector-effect: non-scaling-stroke; }
.stall.ev { fill: var(--stall-ev); }
.stall.acc { fill: var(--stall-acc); }
.col { fill: var(--col); }
.core { fill: var(--core); opacity: .85; }
.lot { fill: var(--lot); stroke: var(--deck-edge); stroke-width: .8; vector-effect: non-scaling-stroke; }
.lotroad { fill: var(--road); }
.island { fill: var(--green); }
.walkway { fill: none; stroke: var(--walk); stroke-width: 1.4; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; opacity: .7; }
.transit { fill: var(--water); opacity: .45; }
.ramp { stroke-width: 1.4; vector-effect: non-scaling-stroke; cursor: pointer; }
.ramp.street { fill: color-mix(in srgb, var(--street) 32%, transparent); stroke: var(--street); }
.ramp.inner { fill: color-mix(in srgb, var(--inner) 30%, transparent); stroke: var(--inner); }
.trench { fill: color-mix(in srgb, var(--street) 45%, transparent); stroke: var(--street); stroke-width: 1.2; vector-effect: non-scaling-stroke; cursor: pointer; }
.arrow { fill: none; stroke: var(--halo); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; pointer-events: none; }
.link { stroke-width: 1.4; vector-effect: non-scaling-stroke; cursor: pointer; }
.link.vehicle { fill: color-mix(in srgb, var(--link) 38%, transparent); stroke: var(--link); }
.link.walk { fill: color-mix(in srgb, var(--walk) 30%, transparent); stroke: var(--walk); stroke-dasharray: 4 3; }
.gate { fill: var(--street); stroke: var(--halo); stroke-width: 1.5; vector-effect: non-scaling-stroke; cursor: pointer; }
.loop { fill: var(--road); stroke: var(--road-edge); stroke-width: 1; vector-effect: non-scaling-stroke; }
.planter { fill: var(--green); }
.sel { fill: none; stroke: var(--accent); stroke-width: 3; vector-effect: non-scaling-stroke; pointer-events: none; }
.hit { fill: transparent; stroke: transparent; stroke-width: 14; vector-effect: non-scaling-stroke; cursor: pointer; }
.lod-stalls .stall, .lod-cols .col { display: none; }

/* ---------- map labels ---------- */
.lbl { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 12px; line-height: 1.2; color: var(--ink);
  text-shadow: 0 0 2px var(--halo), 0 0 2px var(--halo), 0 0 3px var(--halo); will-change: transform; }
.lbl.road { color: var(--muted); font-size: 12px; letter-spacing: .3em; }
.lbl.road.v { writing-mode: vertical-rl; letter-spacing: .25em; }
.lbl.level { font-weight: 700; font-size: 13px; }
.lbl.level small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
.lbl.tag { pointer-events: auto; cursor: pointer; text-shadow: none; display: inline-flex; align-items: center; gap: 4px;
  background: var(--card); border: 1px solid var(--card-edge); border-radius: 999px; padding: 3px 8px 3px 4px; box-shadow: var(--shadow); font-size: 12px; }
.lbl.tag i { font-style: normal; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 700; }
.lbl.tag.street i { background: var(--street); }
.lbl.tag.inner i { background: var(--inner); }
.lbl.tag.vehicle i { background: var(--link); }
.lbl.tag.walk i { background: var(--walk); }
.lbl.tag.gate i { background: var(--street); }
.lbl.tag:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lbl.tag.on { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent), var(--shadow); }

/* ---------- floating UI ---------- */
.card { background: var(--card); border: 1px solid var(--card-edge); border-radius: 10px; box-shadow: var(--shadow); }
.hud { position: absolute; inset: 0; pointer-events: none; padding-left: var(--gl); padding-right: var(--gr); padding-block: 12px; }
.hud > * { pointer-events: auto; }
.search { position: absolute; left: var(--gl); top: 12px; width: min(380px, calc(100% - var(--gl) - var(--gr) - 64px)); height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 8px; }
.logo { flex: none; width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 18px var(--num); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 15px; }
.search input::placeholder { color: var(--muted); }
.iconbtn { flex: none; width: 34px; height: 34px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.iconbtn:hover { background: var(--soft); color: var(--ink); }
.iconbtn:focus-visible, .tabs button:focus-visible, .floors button:focus-visible, .zoom button:focus-visible, .layers button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#suggest { position: absolute; left: var(--gl); top: 64px; width: min(380px, calc(100% - var(--gl) - var(--gr) - 64px)); margin: 0; padding: 6px; list-style: none; max-height: 50%; overflow: auto; z-index: 6; }
#suggest li button { width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
#suggest li button:hover, #suggest li button[aria-selected="true"] { background: var(--chip); }
#suggest small { color: var(--muted); }

#panel { position: absolute; left: var(--gl); top: 68px; bottom: 44px; width: min(380px, calc(100% - var(--gl) - var(--gr) - 64px)); display: flex; flex-direction: column; overflow: hidden; z-index: 4; }
#panel.collapsed { bottom: auto; }
#panel.collapsed .pane { display: none; }
.handle { display: none; }
.tabs { display: flex; gap: 2px; padding: 6px; border-bottom: 1px solid var(--card-edge); flex: none; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--chip); color: var(--accent); font-weight: 700; }
.pane { overflow: auto; padding: 14px 16px 18px; display: grid; gap: 14px; align-content: start; grid-auto-rows: max-content; min-height: 0; }
.pane h2 { margin: 0; font-size: 15px; text-wrap: balance; }
.pane h3 { margin: 4px 0 0; font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: .04em; }
.pane p { margin: 0; line-height: 1.6; color: var(--ink); }
.muted { color: var(--muted); }
.sys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.sys div { border: 1px solid var(--card-edge); border-radius: 8px; padding: 10px; display: grid; gap: 2px; background: var(--soft); }
.sys b { font-size: 20px; font-family: var(--num); }
.sys span { font-size: 12px; color: var(--muted); }
.sys .hero { grid-column: 1 / -1; background: var(--chip); border-color: transparent; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px 4px; border-bottom: 1px solid var(--card-edge); }
td { padding: 7px 4px; border-bottom: 1px solid var(--card-edge); vertical-align: top; }
td.r, th.r { text-align: right; }
.tier { display: inline-block; font: 600 12px var(--num); padding: 1px 6px; border-radius: 5px; background: var(--chip); color: var(--accent); }
.note { border-left: 3px solid var(--accent); padding: 8px 10px; background: var(--soft); border-radius: 0 8px 8px 0; line-height: 1.6; }
.dims { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.dims li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--card-edge); padding-bottom: 6px; }
.dims b { font-weight: 500; }
.ent { display: grid; gap: 8px; }
.ent button { text-align: left; border: 1px solid var(--card-edge); background: var(--card); border-radius: 8px; padding: 10px; cursor: pointer; display: grid; gap: 4px; }
.ent button:hover { border-color: var(--accent); }
.ent .row1 { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.ent .row1 b { font-size: 14px; }
.ent .row2 { color: var(--muted); font-size: 12px; line-height: 1.5; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 1px 7px; border-radius: 999px; white-space: nowrap; border: 1px solid currentColor; }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.risk { color: var(--risk); } .chip.new { color: var(--accent); }
.find { margin: 0; padding-left: 18px; display: grid; gap: 6px; line-height: 1.55; }
.diagram { overflow-x: auto; border: 1px solid var(--card-edge); border-radius: 8px; background: var(--soft); }
.diagram svg { display: block; width: 100%; min-width: 520px; height: auto; }
.diagram-hint { display: none; margin: -8px 0 0 !important; font-size: 12px; color: var(--muted) !important; }
/* The section diagram needs about 520px, so the side panel widens while it is open. */
@media (min-width: 761px) {
  #panel.wide { width: min(560px, calc(100% - var(--gl) - var(--gr) - 64px)); }
  #app.wide-panel .scale { left: calc(var(--gl) + min(560px, calc(100% - var(--gl) - var(--gr) - 64px)) + 16px); }
}
.routes { margin: 0; padding-left: 18px; display: grid; gap: 8px; line-height: 1.55; }
.gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.gallery button { border: 1px solid var(--card-edge); background: var(--card); border-radius: 8px; padding: 0; overflow: hidden; cursor: pointer; text-align: left; display: grid; }
.gallery img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; background: var(--soft); }
.gallery span { padding: 6px 8px 8px; font-size: 12px; line-height: 1.4; }

.right { position: absolute; right: var(--gr); top: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; z-index: 5; }
.compass { width: 40px; height: 40px; display: grid; place-items: center; font: 600 13px var(--num); color: var(--risk); }
.compass svg { width: 22px; height: 22px; }
.floors { display: flex; flex-direction: column; padding: 4px; gap: 2px; width: 74px; }
.floors .bname { font-size: 11px; color: var(--muted); text-align: center; padding: 4px 0 2px; }
.floors button { border: 0; background: transparent; border-radius: 7px; padding: 6px 2px; cursor: pointer; display: grid; gap: 1px; justify-items: center; }
.floors button b { font: 600 15px var(--num); }
.floors button span { font-size: 10px; color: var(--muted); }
.floors button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }
.floors button[aria-checked="true"] span { color: var(--accent-ink); opacity: .85; }
.layers { display: flex; flex-direction: column; padding: 4px; gap: 2px; width: 74px; }
.layers button { border: 0; background: transparent; border-radius: 7px; padding: 6px 2px; cursor: pointer; font-size: 11px; color: var(--muted); }
.layers button[aria-pressed="true"] { color: var(--accent); background: var(--chip); font-weight: 500; }
.zoom { display: flex; flex-direction: column; width: 40px; overflow: hidden; }
.zoom button { border: 0; background: transparent; height: 38px; cursor: pointer; font-size: 18px; color: var(--ink); }
.zoom button + button { border-top: 1px solid var(--card-edge); }
.zoom button:hover { background: var(--soft); }
.scale { position: absolute; left: calc(var(--gl) + min(380px, calc(100% - var(--gl) - var(--gr) - 64px)) + 16px); bottom: 14px; display: flex; flex-direction: column; gap: 2px; color: var(--ink); font: 600 12px var(--num); text-shadow: 0 0 2px var(--halo); pointer-events: none; }
#scaleBar { display: block; height: 6px; border: 2px solid var(--ink); border-top: 0; }
.floorchip { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); padding: 7px 14px; font-size: 13px; max-width: calc(100% - 2 * 400px - 120px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.floorchip b { color: var(--accent); }
.legend { position: absolute; right: var(--gr); bottom: 12px; padding: 8px 10px; display: grid; gap: 4px; font-size: 12px; z-index: 3; }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 10px; border-radius: 2px; display: inline-block; border: 1.5px solid; }

.infowin { position: absolute; z-index: 8; width: min(320px, calc(100% - var(--gl) - var(--gr))); padding: 12px 14px 12px; display: grid; gap: 8px; }
.infowin::after { content: ""; position: absolute; left: var(--tip, 50%); bottom: -7px; width: 12px; height: 12px; background: var(--card); border-right: 1px solid var(--card-edge); border-bottom: 1px solid var(--card-edge); transform: translateX(-50%) rotate(45deg); }
.infowin.below::after { display: none; }
.infowin header { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.infowin h4 { margin: 0; font-size: 16px; text-wrap: balance; }
.infowin .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.infowin dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; }
.infowin dt { color: var(--muted); }
.infowin dd { margin: 0; }
.infowin .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.infowin .acts button { border: 1px solid var(--card-edge); background: var(--soft); border-radius: 7px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
.infowin .acts button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

#lightbox { position: absolute; inset: 0; z-index: 20; background: color-mix(in srgb, var(--land) 20%, #000 80%); display: grid; grid-template-rows: auto 1fr auto; padding-left: var(--gl); padding-right: var(--gr); padding-block: 12px; gap: 10px; color: #f3f5f8; }
#lightbox header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
#lightbox h4 { margin: 0; font-size: 16px; }
#lightbox .stage { min-height: 0; display: grid; place-items: center; }
#lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
#lightbox p { margin: 0; line-height: 1.6; max-width: 80ch; color: #d6dbe3; }
#lightbox .nav { display: flex; gap: 8px; }
#lightbox button { border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #f3f5f8; border-radius: 8px; padding: 6px 12px; cursor: pointer; }

@media (max-width: 760px) {
  .search, #suggest { width: calc(100% - var(--gl) - var(--gr) - 56px); }
  .floorchip { display: none; }
  .legend { display: none; }
  .right { top: 66px; gap: 8px; }
  .floors, .layers { width: 62px; }
  #panel { left: 0; right: 0; top: auto; bottom: 0; width: auto; height: 46%; border-radius: 16px 16px 0 0; border-bottom: 0; padding-left: var(--gl); padding-right: var(--gr); }
  #panel.collapsed { height: 104px; bottom: 0; }
  #app:not(.sheet-low) .layers, #app:not(.sheet-low) .zoom { display: none; }
  #panel.collapsed .pane { display: none; }
  .handle { display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--card-edge); margin: 8px auto 0; flex: none; border: 0; cursor: pointer; padding: 0; }
  .tabs { border-bottom: 0; }
  .pane { padding: 6px 2px 18px; }
  .scale { left: var(--gl); bottom: calc(46% + 10px); }
  #panel.collapsed ~ .scale { bottom: 114px; }
  .infowin { left: var(--gl) !important; top: auto !important; bottom: calc(46% + 12px); width: calc(100% - var(--gl) - var(--gr)); }
  #app.sheet-low .infowin { bottom: 116px; }
  .infowin::after { display: none; }
  .diagram-hint { display: block; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<script>

const bounds = list => { let x0 = Infinity, z0 = Infinity, x1 = -Infinity, z1 = -Infinity; for (const a of list) for (let i = 0; i < a.length; i += 2) { x0 = Math.min(x0, a[i]); x1 = Math.max(x1, a[i]); z0 = Math.min(z0, a[i + 1]); z1 = Math.max(z1, a[i + 1]); } return { x0, z0, x1, z1 }; };

// ---------- data model ----------
const LV = Object.fromEntries(D.levels.map(l => [l.id, l]));
const lvName = id => id === 'street' ? '地面' : (LV[id]?.name || id);

const STEM = id => id.replace(/-(IN|OUT|DN|UP|B1-B2-DOWN|B2-B1-UP)$/, '');
const PAIR_NAME = {

  'street|WPG': '西北公共口', 'street|WPG-SOUTH': '西南公共口', 'street|P2': '二期车库口', 'street|P3': '三期车库口',

};

  ['04-wpg-b2-top', '西侧公共车库 B2（-8.4m）俯视', '1,064 个车位。东侧经跨西外环隧道平层接一期 B1。'],

  ['15-ground-north-portal', '方庭北口地面口部', '北外环一侧的雨棚、闸杆和入口/出口标识。'],
  ['16-ground-east-portal', '星湾东口地面口部', '星湾路一侧的雨棚、闸杆和标识。'],
  ['17-west-lot-top', '西侧地面停车场俯视', '576 个车位，6 个车行口；场内两处坡道下到西库 B1。'],

  ['19-hotel-entrance', '酒店南口与落客环岛', '两条坡道有长雨棚；地面保留 22 个短停车位。'],
];
const SHOT_INDEX = Object.fromEntries(SHOTS.map((s, i) => [s[0].slice(0, 2), i]));
const shotOf = n => SHOT_INDEX[n];

// Ramp pairs: one map object per entrance or between-floor ramp pair.
const pairs = new Map();
for (const r of D.ramps) {
  const key = `${r.kind}|${STEM(r.id)}`;
  if (!pairs.has(key)) pairs.set(key, { key, id: 'pair:' + key, kind: r.kind, name: PAIR_NAME[key] || r.name, ramps: [], system: r.system });
  pairs.get(key).ramps.push(r);
}
const ENT = Object.fromEntries(D.entrances.map(e => [e.id, e]));
for (const p of pairs.values()) {
  const c = p.ramps.map(r => [(r.low.x + r.high.x) / 2, (r.low.z + r.high.z) / 2]);
  p.at = [c.reduce((s, q) => s + q[0], 0) / c.length, c.reduce((s, q) => s + q[1], 0) / c.length];
  p.mouth = p.kind === 'street' ? [p.ramps.reduce((s, r) => s + r.high.x, 0) / p.ramps.length, p.ramps.reduce((s, r) => s + r.high.z, 0) / p.ramps.length] : null;
  p.low = p.ramps[0].low.level; p.high = p.ramps[0].high.level;
  p.tiers = [...new Set(p.ramps.flatMap(r => r.tiers))];
  p.expansion = p.ramps.some(r => r.expansion);
  p.entrances = p.ramps.map(r => ENT[r.id]).filter(Boolean);
  p.dist = p.entrances.length ? Math.min(...p.entrances.map(e => e.toIntersection)) : null;
}
const PAIR_SHOTS = { 'street|P1-N': ['15', '09'], 'street|P1-E': ['16', '10'], 'inner|P1': ['08'], 'inner|P1-SHARED-N': ['09'], 'inner|WPG': ['14'], 'street|H': ['19'], 'street|WPG': ['17'], 'street|WPG-SOUTH': ['17'] };

const LINK_GEO = Object.fromEntries(D.links.map(l => [l.id, l]));
const LINKS = [
  { id: 'link:tunnel', name: '跨西外环车行隧道', kind: 'vehicle', tier: 't2', from: 'WPG-B2', to: 'P1-B1', width: 6, geo: ['shared-west-tunnel'], at: [-293, -179], shots: ['11', '05'],
    note: '从西外环路面下穿过，两端都在 -8.4m，平层双向通行。西侧地面停车场进来的车可经西库 B1 → B2 → 隧道到一期 B1。' },
  { id: 'link:hotel', name: '酒店车行连接道', kind: 'vehicle', tier: 't2', from: 'H-B2', to: 'P1-B1', width: 6, geo: ['P1-hotel-dock-B1'], at: [-205, -81.2], shots: ['12', '05'],
    note: '酒店 B2 与一期 B1 同为 -8.4m，经 6m 平层连接道互通；酒店南口进来的车可一路开进一期地库。' },
  { id: 'link:apartment', name: '公寓车行连接道', kind: 'vehicle', tier: 't2', from: 'A-B2', to: 'P1-B1', width: 6, geo: ['P1-apartment-dock-B1'], at: [-60, -173.5], shots: ['13', '05'],
    note: '公寓 B2 与一期 B1 同为 -8.4m，经 6m 平层连接道互通。' },
  { id: 'link:west-walk', name: '西库—B1M 步行连廊', kind: 'walk', tier: 't1', from: 'WPG-B1', to: 'P1-B1M', width: 5, geo: ['west-parking-mall'], at: [-292, -200], shots: ['06'],
    note: '-4.5m 步行连廊，从西库 B1 走到一期 B1M 美食广场和地铁站厅，不通车。' },
  { id: 'link:hotel-walk', name: '酒店—B1M 步行连廊', kind: 'walk', tier: 't1', from: 'H-B1', to: 'P1-B1M', width: 5, geo: ['hotel-mall-metro'], at: [-208.5, -81.2], shots: ['06'],
    note: '-4.5m 步行连廊，酒店 B1 直通一期 B1M 与地铁。' },
  { id: 'link:apartment-walk', name: '公寓—B1M 步行连廊', kind: 'walk', tier: 't1', from: 'A-B1', to: 'P1-B1M', width: 5, geo: ['apartment-mall-metro'], at: [-46, -173.5], shots: ['06'],
    note: '-4.5m 步行连廊，公寓 B1 直通一期 B1M 与地铁。' },
  { id: 'link:res', name: '住宅地下车行通道', kind: 'vehicle', tier: 't1', from: 'R1-B1', to: 'R2/R3/R4-B1', width: 6, geo: ['residential-garage-spine', 'residential-2-garage', 'residential-3-garage', 'residential-4-garage'], at: [157, -190], shots: [],
    note: '四栋住宅 B1 由一条 6m 地下车行通道串起，共用住宅车库口进出；不接一期。' },
  { id: 'link:res-walk', name: '住宅—二期 B1 步行连廊', kind: 'walk', tier: 't1', from: 'R1-B1', to: 'P2-B1', width: 5, geo: ['residential-mall-metro'], at: [106, -163], shots: [],
    note: '住宅 B1 走到二期 B1 与地铁的步行连廊，不通车。' },
];
const GATES = D.surface.west.gates.map(g => ({ ...g, id: 'gate:' + g.id, gid: g.id, ent: ENT[g.id], shots: ['17', '18'] }));
const OBJ = new Map([...[...pairs.values()].map(p => [p.id, p]), ...LINKS.map(l => [l.id, l]), ...GATES.map(g => [g.id, g])]);

// ---------- SVG scene ----------
const G = {};
const group = (name, parent = world, attrs = {}) => (G[name] = el('g', attrs, parent));
group('base');
for (const f of FLOORS) group(f.id, world, { 'data-floor': f.id });
group('sel');
const near = a => { const b = bounds([a]); return b.x1 > -620 && b.x0 < 360 && b.z1 > -320 && b.z0 < 300; };

// Basemap shared by every floor (dimmed underground, like an indoor map over the city).
el('rect', { x: -1400, y: -1400, width: 2800, height: 2800, class: 'land' }, G.base);
for (const p of D.plots) el('path', { d: ring(p.poly), class: 'plot' + (p.id === 'park' ? ' park' : '') }, G.base);
const roadsG = el('g', {}, G.base);
for (const r of D.roads) el('path', { d: 'M' + r.poly.map(q => q.join(' ')).join('L') + 'Z', class: 'road' + (['avenue', 'xingwan'].includes(r.id) ? ' major' : '') }, roadsG);
const groundOnly = el('g', {}, G.ground);
for (const c of D.crossings) el('path', { d: 'M' + c.poly.map(q => q.join(' ')).join('L') + 'Z', class: 'xing' }, groundOnly);

for (const f of ['t1', 't2', 't3']) for (const b of D.footprints) el('path', { d: ring(b.poly), class: 'ghost' }, G[f]);

// Ground: surface lots, ramp mouths and gates.
const W = D.surface.west, HL = D.surface.hotel;
el('path', { d: ring(W.poly), class: 'lot' }, G.ground);
el('path', { d: W.roads.flatMap(r => r.polys).map(ring).join(''), class: 'lotroad' }, G.ground);
el('path', { d: rings(W.islands), class: 'island' }, G.ground);
el('path', { d: ring(W.transit.poly), class: 'transit' }, G.ground);
el('path', { d: W.walks.flatMap(w => w.polys).map(ring).join(''), class: 'walkway' }, G.ground);
el('path', { d: ring(HL.poly), class: 'lot' }, G.ground);
el('path', { d: ring(HL.aisle), class: 'lotroad' }, G.ground);

stallPaths(G.ground, W.stalls); stallPaths(G.ground, HL.stalls);

const arrowAlong = (parent, a, b, every = 14) => {
  const len = Math.hypot(b[0] - a[0], b[1] - a[1]), ux = (b[0] - a[0]) / len, uz = (b[1] - a[1]) / len, nx = -uz, nz = ux;
  const n = Math.max(1, Math.round(len / every));
  let d = '';
  for (let i = 0; i < n; i++) {
    const t = (i + .5) / n, cx = a[0] + (b[0] - a[0]) * t, cz = a[1] + (b[1] - a[1]) * t;
    d += `M${cx - ux * 1.2 + nx * 1.3} ${cz - uz * 1.2 + nz * 1.3}L${cx + ux * 1.2} ${cz + uz * 1.2}L${cx - ux * 1.2 - nx * 1.3} ${cz - uz * 1.2 - nz * 1.3}`;
  }

};
const hitTargets = [];
function addHit(parent, d, obj, cls) {
  const shape = el('path', { d, class: cls, 'data-obj': obj.id }, parent);
  const hit = el('path', { d, class: 'hit', 'data-obj': obj.id }, parent);

}
for (const p of pairs.values()) if (p.kind === 'street') for (const r of p.ramps) {
  addHit(G.ground, ring(r.open || r.poly), p, 'trench');
  arrowAlong(G.ground, [r.from.x, r.from.z], [r.to.x, r.to.z], 10);
}

  const d = Math.abs(fx) > Math.abs(fz) ? ring([g.x - 1.5, g.z - hw, g.x + 1.5, g.z - hw, g.x + 1.5, g.z + hw, g.x - 1.5, g.z + hw]) : ring([g.x - hw, g.z - 1.5, g.x + hw, g.z - 1.5, g.x + hw, g.z + 1.5, g.x - hw, g.z + 1.5]);
  addHit(G.ground, d, g, 'gate');
}

// Underground tiers: decks, lanes, stalls, columns, cores, ramps and links.
for (const f of ['t1', 't2', 't3']) {
  const g = G[f], levels = tierLevels(f);

    el('path', { d: rings([...l.aisles, ...l.spines]), class: 'aisle' }, g);

// Vertical connections: section diagram of the shared garage.

arrow(`M${COLS.WPG} ${ROWS.ground + 26}V${top(B['WPG-B1']) - 2}`, 'street', '2 对', COLS.WPG + 22, ROWS.ground + 72);
arrow(`M${COLS.H} ${ROWS.ground + 26}V${top(B['H-B1']) - 2}`, 'street', '1 对', COLS.H + 22, ROWS.ground + 72);

arrow(`M${COLS.A} ${ROWS.ground + 26}V${top(B['A-B1']) - 2}`, 'street', '1 对', COLS.A + 22, ROWS.ground + 72);

arrow(`M${COLS.H} ${bot(B['H-B1']) + 2}V${top(B['H-B2']) - 2}`, 'inner', '1 对', COLS.H + 22, mid(B['H-B1']) + 66);
arrow(`M${COLS.A} ${bot(B['A-B1']) + 2}V${top(B['A-B2']) - 2}`, 'inner', '1 对', COLS.A + 22, mid(B['A-B1']) + 66);
arrow(`M${COLS.P1} ${bot(B['P1-B1']) + 2}V${top(B['P1-B2']) - 2}`, 'inner', '2 对（中庭 · 北侧）', COLS.P1 + 64, mid(B['P1-B1']) + 66);
arrow(`M${COLS.WPG} ${bot(B['WPG-B2']) + 2}C${COLS.WPG} ${bot(B['WPG-B2']) + 48} ${COLS.P1 - BW / 2 - 40} ${bot(B['P1-B1']) + 48} ${COLS.P1 - BW / 2 + 8} ${bot(B['P1-B1']) + 2}`, 'link', '跨西外环隧道', (COLS.WPG + COLS.H) / 2 + 20, bot(B['WPG-B2']) + 52);
arrow(`M${COLS.H + BW / 2 + 2} ${mid(B['H-B2'])}H${COLS.P1 - BW / 2 - 2}`, 'link', '连接道', (COLS.H + COLS.P1) / 2, mid(B['H-B2']) - 8);
arrow(`M${COLS.A - BW / 2 - 2} ${mid(B['A-B2'])}H${COLS.P1 + BW / 2 + 2}`, 'link', '连接道', (COLS.A + COLS.P1) / 2, mid(B['A-B2']) - 8);
arrow(`M${COLS.H + BW / 2 + 2} ${mid(B['H-B1'])}H${COLS.P1 - BW / 2 - 2}`, 'walk', '步行', (COLS.H + COLS.P1) / 2, mid(B['H-B1']) - 8);

arrow(`M${COLS.WPG} ${top(B['WPG-B1']) - 2}C${COLS.WPG} ${top(B['WPG-B1']) - 30} ${COLS.P1 - 30} ${top(B['P1-B1M']) - 30} ${COLS.P1 - 30} ${top(B['P1-B1M']) - 2}`, 'walk', '步行连廊', (COLS.WPG + COLS.H) / 2 + 30, top(B['WPG-B1']) - 30, true);
for (const b of boxes) {

  h('h3', {}, '人怎么走'),
  h('p', {}, '一期 18 部电梯、21 组楼梯服务 B1/B2；西库 4 部电梯、9 组楼梯；酒店、公寓各 2 部电梯。-4.5m 层的西库 B1、酒店 B1、公寓 B1 都有步行连廊通一期 B1M 美食广场和地铁站厅。'));

$('[data-pane="shots"]').append(h('h2', {}, '游戏内实景截图'), h('p', { class: 'muted' }, '俯视图按真实坐标标注；鸟瞰图隐藏了地面和上层，只留相关楼层。点开看大图。'), gal);
let lbIndex = 0;
function openLightbox(i) { $('#lightbox').hidden = false; showShot(i); $('#lbClose').focus(); }
function showShot(i) { lbIndex = (i + SHOTS.length) % SHOTS.length; const [f, t, d] = SHOTS[lbIndex]; $('#lbImg').src = `shots/${f}.jpg`; $('#lbImg').alt = t; $('#lbTitle').textContent = `${lbIndex + 1} / ${SHOTS.length} · ${t}`; $('#lbText').textContent = d; }
function closeLightbox() { $('#lightbox').hidden = true; }
$('#lbClose').onclick = closeLightbox; $('#lbPrev').onclick = () => showShot(lbIndex - 1); $('#lbNext').onclick = () => showShot(lbIndex + 1);

// ---------- search ----------
const index = [
  ...[...pairs.values()].map(p => ({ o: p, t: p.name, s: p.kind === 'street' ? `${p.entrances[0]?.via || ''} · 落 ${lvName(p.low)}` : `${lvName(p.high)} ⇄ ${lvName(p.low)}` })),
  ...LINKS.map(L => ({ o: L, t: L.name, s: `${lvName(L.from)} ⇄ ${L.to.includes('/') ? L.to : lvName(L.to)}` })),
  ...GATES.map(g => ({ o: g, t: g.name, s: `西侧地面停车场 · ${g.ent.via}` })),
  ...D.levels.map(l => ({ lv: l, t: l.name, s: `${m(l.elev)} · ${l.stallCount ? fmt(l.stallCount) + ' 个车位' : '步行层'}` })),
];
const q = $('#q'), sug = $('#suggest');
let hits = [], active = -1;
function suggest() {
  const v = q.value.trim();
  hits = v ? index.filter(x => (x.t + x.s).includes(v)).slice(0, 8) : [];
  active = hits.length ? 0 : -1;
  sug.replaceChildren(...hits.map((x, i) => h('li', {}, h('button', { type: 'button', role: 'option', 'aria-selected': String(i === active), onclick: () => choose(x) }, h('span', {}, x.t), h('small', {}, x.s)))));
  sug.hidden = !hits.length;
}
function choose(x) {
  sug.hidden = true; q.value = x.t;
  if (x.o) focusObj(x.o);
  else { setFloor(x.lv.tier); const b = bounds(x.lv.slab.map(s => s.outer)), v = fit(b, 30); flyTo(v.cx, v.cz, v.k); }
}
q.addEventListener('input', suggest);
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!hits.length) return; active = (active + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length; [...sug.querySelectorAll('button')].forEach((b, i) => b.setAttribute('aria-selected', String(i === active))); }
  else if (e.key === 'Enter' && hits[active]) choose(hits[active]);
  else if (e.key === 'Escape') { sug.hidden = true; }
});
q.addEventListener('blur', () => setTimeout(() => { sug.hidden = true; }, 150));

// ---------- start ----------
setFloor('t2');
if (innerWidth <= 760) setSheet(true);
const v0 = fit(HOME); Object.assign(V, v0);
render();
})();
